services:
  proxy:
    build: .
    restart: unless-stopped
    # Runs as the non-root uid baked into the image; ./data is chowned to 10001.
    user: "10001:10001"
    ports:
      - "127.0.0.1:8181:8080"          # proxy — localhost
      - "${TAILSCALE_IP}:8181:8080"    # proxy — tailnet
      - "${TAILSCALE_IP}:8182:8090"    # admin — tailnet only, never public
    env_file:
      - .env
    volumes:
      # Single data dir (not per-file) so atomic temp+rename writes work.
      - ./data:/app/data
    logging:
      options:
        max-size: "10m"
        max-file: "1"
